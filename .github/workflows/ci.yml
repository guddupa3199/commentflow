name: check

on:
  push:
  pull_request:
  # Dependencies are pinned with "=", so a newly disclosed advisory will never
  # arrive on its own. The weekly run is what turns the audit job below into an
  # actual alarm rather than a check that only fires when someone pushes.
  schedule:
    - cron: '17 4 * * 1'

# Runner images are pinned to a release rather than "-latest", so an image
# rollover is a deliberate bump in this file instead of a surprise on a Monday.
jobs:
  # Windows is in this matrix because the "build" job below ships a Windows
  # binary, and a released artifact whose test suite has never run on the target
  # is a promise nobody checked. It is also the platform where this tool differs
  # most: "write_atomic" compiles out its whole "#[cfg(unix)]" permission branch,
  # "fs::rename" has its own replace semantics, and line endings are load-bearing
  # throughout ("had_crlf", "spans_bare_cr"). Compiling that is not the same as
  # running it. ".gitattributes" pins "* -text" so a Windows checkout is byte
  # identical to a Linux one, which keeps the corpus fixtures honest.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # fmt, clippy -D warnings, and the test suite. Same script a contributor
      # runs locally, so CI cannot drift from "make indent" plus "cargo test".
      # "shell: bash" picks Git Bash on the Windows runner, whose default is
      # pwsh; the script itself stays one script for every platform.
      - run: ./scripts/check.sh
        shell: bash

  # "rust-version" in Cargo.toml is a promise. This is the only thing that keeps
  # it honest: the crate uses let-chains, stabilized in 1.88, so that is the
  # floor until something newer is used.
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings

  # "src/" contains no "unsafe" block, so the only memory these can find a bug in
  # is the linked C: the four tree-sitter grammar crates and the runtime, driven
  # by whatever "tests/corpus" and the suite feed them. That is also why "CFLAGS"
  # is the load-bearing half of each job. Without it the "cc"-compiled grammars
  # stay uninstrumented and the run reports zero findings because it checked
  # nothing, which is worse than having no job at all. The "verify" step below
  # exists to make that failure loud.
  #
  # "continue-on-error" on both, until each has run green twice. A nightly-only
  # job that breaks on a toolchain roll must not block unrelated PRs on day one,
  # and leaving that promise to a branch-protection setting puts it somewhere no
  # reviewer of this file can see. Delete the two lines to make them blocking.
  #
  # "CC=clang" because rustc links LLVM's sanitizer runtime and the runner's
  # default "CC" is gcc; gcc-instrumented objects against LLVM's runtime is a
  # coin flip. The explicit "--target" is for "RUSTFLAGS", which cargo then keeps
  # out of build scripts and proc macros; it does not stop "CFLAGS" reaching
  # them, and does not need to ("cc" tries "CFLAGS_<target>" and "TARGET_CFLAGS"
  # first, then falls back to a bare "CFLAGS").
  #
  # "-Zbuild-std" is deliberately omitted. Without it "std" stays uninstrumented,
  # which is the right trade here: the target is the C, and rebuilding std per
  # job costs more than it finds. Do not "fix" this later.
  #
  # Not here and not to be added: MSan needs every dependency including "std"
  # rebuilt instrumented, and uninstrumented tree-sitter reports false positives
  # all day. TSan waits for concurrency to return. Valgrind would duplicate ASan.
  asan:
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      CC: clang
      CFLAGS: -fsanitize=address
      RUSTFLAGS: -Zsanitizer=address
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # "-Zsanitizer" is still unstable, hence the nightly toolchain above. No
      # "+nightly" here: the action already made it the default, and naming it
      # twice means a later pin to a dated nightly silently disagrees with it.
      - run: cargo test --target x86_64-unknown-linux-gnu
      # Prove the C was actually instrumented. "ASAN_OPTIONS=verbosity=1" does
      # NOT do this: it prints runtime init and the shadow layout, not a module
      # list, so it looks identical whether or not the grammars were built with
      # "-fsanitize=address". Check for the symbols directly.
      #
      # "find" rather than a hardcoded "target/<triple>/debug/build/..." glob:
      # that path is cargo's business and it moves. The runner already proved
      # it, laying the objects out as "build/tree-sitter-c/<hash>/out" where
      # the local cargo writes "build/tree-sitter-c-<hash>/out". Both spellings
      # are matched, and the second is anchored on a whole path component so it
      # cannot pick up tree-sitter-cpp. On no match this prints the objects that
      # DO exist, so the next run says where they went instead of failing with
      # an unexpanded glob and no information.
      - name: Verify the grammars carry ASan instrumentation
        run: |
          objs=$(find target \( -path '*tree-sitter-c-*/out/*.o' \
                                -o -path '*/tree-sitter-c/*/out/*.o' \))
          if [ -z "$objs" ]; then
            echo "no tree-sitter-c objects under target/; what is there:"
            find target -name '*.o' -path '*tree-sitter*' | head -20
            exit 1
          fi
          echo "$objs"
          nm $objs | grep -q __asan_

  # UBSan is C-only: Rust has no "-Zsanitizer=undefined", so "RUSTFLAGS" is left
  # alone here and only the grammars are instrumented. Stable toolchain,
  # therefore, unlike the ASan job.
  #
  # The runtime form needs help linking: rustc drives the final link with "cc"
  # and never adds libclang_rt.ubsan, so the build dies on undefined
  # "__ubsan_handle_*" referenced from the tree-sitter scanners. "-Clinker=clang
  # -Clink-arg=-fsanitize=undefined" supplies it, which is why "RUSTFLAGS" is
  # set here even though Rust itself has no "-Zsanitizer=undefined" and none of
  # the Rust code is instrumented.
  #
  # Trap mode ("-fsanitize-trap=undefined") was tried first because it needs no
  # runtime at all. It works, but a finding then arrives as a test killed by
  # SIGILL with no message, which is nearly useless in a CI log: the first real
  # finding cost a full round trip to learn nothing but "something, somewhere".
  # A sanitizer that cannot say what it found is not worth the job slot.
  ubsan:
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      # "-fno-sanitize=function" is the one check turned off, and it is turned
      # off because the finding is upstream and not ours to fix. tree-sitter's
      # parser.c:369 stores every grammar's external-scanner entry points in a
      # "void *(*)(void)" table and calls them through it with their real
      # signatures, so the "function" check fires once per grammar with an
      # external scanner (rust, bash). Calling through an incompatible function
      # pointer type is UB by the letter of C, and it is also a decades-old C
      # dispatch idiom that the check only started flagging when clang 17 began
      # enabling it for C. Fixing it means patching a pinned third-party crate.
      # Every other UBSan check stays on, so the memory-shaped UB this job
      # exists to catch still fails the run. Retry without this flag whenever
      # tree-sitter is bumped.
      CC: clang
      CFLAGS: -fsanitize=undefined -fno-sanitize=function
      RUSTFLAGS: -Clinker=clang -Clink-arg=-fsanitize=undefined
      # Print the file, line, and kind of UB rather than just the summary line,
      # and keep going so one finding does not hide the rest.
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Findings go to stderr and do not fail the process, so the run is teed
      # and inspected below. Without that a "runtime error:" line scrolls past
      # in a green log and nobody ever reads it.
      #
      # "pipefail" is not optional here: GitHub's default shell is "bash -e"
      # WITHOUT it (the log line reads "shell: /usr/bin/bash -e {0}"), so the
      # pipeline would report tee's exit status and a failing test suite would
      # sail through as a green job.
      - run: |
          set -o pipefail
          cargo test --no-fail-fast 2>&1 | tee ubsan.log
      - name: Report UBSan findings
        run: |
          if grep -n 'runtime error:' ubsan.log; then
            echo "::error::UBSan reported undefined behavior in the linked C"
            exit 1
          fi
          echo "no UBSan findings"
      # Same reasoning as the ASan verify step: a green run proves nothing if
      # "CFLAGS" never reached the grammars.
      - name: Verify the grammars carry UBSan instrumentation
        run: |
          objs=$(find target -path '*tree-sitter*/out/*.o')
          if [ -z "$objs" ]; then
            echo "no tree-sitter objects under target/; what is there:"
            find target -name '*.o' | head -20
            exit 1
          fi
          echo "$objs"
          # Across all the grammar objects, not one of them: which UBSan checks
          # a given translation unit needs depends on what it does, and a table
          # driven parser.c can legitimately need none.
          nm $objs | grep -q __ubsan_

  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
          - name: Windows x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      # tar, not zip, on every platform including Windows: bsdtar has shipped in
      # Windows since 10 1803, and one archive format keeps the download
      # instructions in README one line instead of three. A tarball also carries
      # the executable bit, which a bare binary served over HTTPS does not.
      - name: Package
        shell: bash
        run: |
          tar czf commentflow-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release \
            commentflow${{ runner.os == 'Windows' && '.exe' || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: commentflow-${{ matrix.target }}
          path: commentflow-${{ matrix.target }}.tar.gz

  # A rolling "latest" release, so the newest main build is one download away
  # instead of behind a login wall with a 90-day expiry, which is all the
  # artifacts above are. It needs "check" as well as "build": shipping a binary
  # whose test suite went red is worse than shipping nothing.
  #
  # Delete and recreate rather than upload "--clobber": the "latest" tag has to
  # move to the commit that produced these binaries, and there is no gh
  # invocation that repoints an existing tag. That leaves a window where the
  # release is gone and its replacement does not exist yet, which drives the two
  # rules below. "cancel-in-progress: false" queues a second push behind this
  # job instead of killing it mid-window, and the assets are staged and counted
  # before anything is deleted, so a missing artifact fails while the old
  # release is still up.
  release:
    needs: [check, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-latest
      cancel-in-progress: false
    # No checkout: nothing here reads the tree, and gh resolves the repo from
    # GH_REPO rather than a git remote.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          # Without a pattern this collects every artifact in the run, so any
          # artifact added to another job later would silently ship as a release
          # asset.
          pattern: commentflow-*
          path: dist
          merge-multiple: true
      # Name every asset rather than counting them. A bare count passes when a
      # target is renamed or swapped for another, which publishes the wrong set
      # under a name users are told to trust; the names are also what README
      # documents, so they are the actual contract. This list duplicates the
      # "build" matrix on purpose: Actions has no YAML anchors, and threading
      # the targets through a setup job's "fromJSON" output buys one less
      # duplicated line at the cost of a whole extra job. A rename now fails
      # here instead of shipping quietly.
      #
      # The glob is also what guards against gh receiving a literal
      # "dist/*.tar.gz" when nothing matched.
      - name: Stage assets
        run: |
          expected=(
            commentflow-x86_64-unknown-linux-gnu.tar.gz
            commentflow-aarch64-apple-darwin.tar.gz
            commentflow-x86_64-pc-windows-msvc.tar.gz
          )
          shopt -s nullglob
          found=(dist/*.tar.gz)
          missing=()
          for name in "${expected[@]}"; do
            [ -f "dist/$name" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -ne 0 ] || [ ${#found[@]} -ne ${#expected[@]} ]; then
            echo "release assets do not match the expected set" >&2
            echo "  missing: ${missing[*]:-none}" >&2
            echo "  found:   ${found[*]:-none}" >&2
            exit 1
          fi
          printf 'dist/%s\n' "${expected[@]}" > assets.txt
      # Read the HTTP status rather than branching on gh's exit code. gh exits
      # nonzero for every HTTP failure alike, so "if gh ... ; then" reads a 500,
      # a revoked token, or a DNS blip as "no release here" and walks straight
      # into the deletions below. Only 200 and 404 are answers; anything else is
      # an unknown state, and deleting things from an unknown state is how the
      # tag of a live release gets removed.
      - name: Replace the latest release
        run: |
          status_of() {
            gh api "$1" --silent -i 2>/dev/null | head -1 | awk '{print $2}'
          }
          require_answer() {
            case "$1" in
              200|404) return 0 ;;
            esac
            echo "unexpected status '${1:-none}' querying $2; aborting before any deletion" >&2
            exit 1
          }

          release_status=$(status_of "repos/$GH_REPO/releases/tags/latest")
          require_answer "$release_status" "the latest release"
          if [ "$release_status" = 200 ]; then
            gh release delete latest --yes --cleanup-tag
          fi

          # The tag can outlive the release: deleting a release in the web UI
          # leaves its tag behind, and so does a run that got as far as the
          # delete and then failed. "gh release create" ignores "--target" when
          # the tag already exists (the API documents "target_commitish" as
          # unused in that case), so a stale "latest" tag would publish these
          # binaries under a release pointing at an older commit.
          #
          # Query this only after the delete above: "--cleanup-tag" already
          # removes the tag, so a status read taken earlier would send us to
          # delete a ref that no longer exists, and that 404 would fail the step.
          tag_status=$(status_of "repos/$GH_REPO/git/ref/tags/latest")
          require_answer "$tag_status" "the latest tag"
          if [ "$tag_status" = 200 ]; then
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/latest" >/dev/null
          fi
          mapfile -t assets < assets.txt
          gh release create latest "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "latest" \
            --notes "Automated build of ${GITHUB_SHA:0:7} on $(date -u +%Y-%m-%d)."
